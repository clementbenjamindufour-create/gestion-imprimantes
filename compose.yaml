name: gestion-imprimantes
services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      PRINTERS_DATA_DIR: /data
      PRINTERS_CORS_ORIGINS: '[]'
    volumes:
      - library-data:/data
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
volumes:
  library-data:
